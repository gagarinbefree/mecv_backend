"""Запросы публичной цифровой визитки."""
type Query {
  """Профиль специалиста; null, если профиль ещё не создан."""
  profile: Profile
}

"""Профессиональный профиль и связанные с ним данные."""
type Profile {
  """Имя специалиста."""
  name: String!

  """Краткое описание специализации и профессиональных интересов."""
  description: String!

  """Профессиональные ссылки в порядке отображения; пустой список, если ссылок нет."""
  links: [ProfileLink!]!

  """Навыки в порядке отображения; пустой список, если навыки не указаны."""
  skills: [Skill!]!

  """Опыт работы в порядке отображения; пустой список, если опыт не указан."""
  experience: [Experience!]!

  """Проекты в порядке отображения; пустой список, если проектов нет."""
  projects: [Project!]!
}

"""Ссылка на профессиональный ресурс специалиста."""
type ProfileLink {
  """Название ресурса, например GitHub или LinkedIn."""
  label: String!

  """Абсолютный URL профессионального ресурса."""
  url: String!
}

"""Профессиональный навык специалиста."""
type Skill {
  """Название навыка или технологии."""
  name: String!
}

"""Период работы в компании и профессиональные достижения."""
type Experience {
  """Название компании."""
  company: String!

  """Занимаемая должность."""
  position: String!

  """Дата начала работы."""
  startDate: Date!

  """Дата окончания работы; null для текущего места работы."""
  endDate: Date

  """Достижения в порядке отображения; пустой список, если достижения не указаны."""
  achievements: [String!]!
}

"""Проект специалиста со ссылкой на приложение или репозиторий."""
type Project {
  """Название проекта."""
  name: String!

  """Краткое описание проекта; null, если описание не указано."""
  description: String

  """Абсолютный URL проекта или его репозитория."""
  url: String!
}

"""Календарная дата в формате YYYY-MM-DD без времени и часового пояса."""
scalar Date
